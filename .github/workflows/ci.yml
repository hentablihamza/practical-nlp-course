name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute every notebook (offline)
        env:
          # Notebooks read only the files cached in data/ and never touch the network.
          NLP_OFFLINE: "1"
        run: |
          shopt -s nullglob
          nbs=(notebooks/*.ipynb)
          echo "Found ${#nbs[@]} notebook(s)"
          for nb in "${nbs[@]}"; do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute --inplace \
              --ExecutePreprocessor.timeout=1200 "$nb"
            echo "::endgroup::"
          done

      - name: Confirm notebooks produced output
        run: |
          python - <<'PY'
          import glob, nbformat, sys
          files = sorted(glob.glob("notebooks/*.ipynb"))
          bad = [f for f in files
                 if not any(c.cell_type == "code" and c.get("outputs")
                            for c in nbformat.read(f, 4).cells)]
          if bad:
              print("No outputs in:", bad); sys.exit(1)
          print(f"All {len(files)} notebook(s) executed with outputs.")
          PY
